name: Usage history performance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usage-history-performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  history-performance:
    name: Usage history Release budget
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify failure policy
        run: python3 -m unittest discover -s scripts/tests -p 'test_usage_history_performance.py' -v

      - name: Compare Release history with the frozen baseline
        run: >-
          python3 scripts/usage-history-performance/run.py
          --output "${{ runner.temp }}/usage-history-performance"

      - name: Preserve samples, machine metadata, and gate result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: usage-history-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/usage-history-performance/*.json
            ${{ runner.temp }}/usage-history-performance/*.log
          if-no-files-found: warn
          retention-days: 30
