name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run pinned SwiftLint policy
        run: >-
          xcrun swift package plugin
          --allow-writing-to-package-directory
          swiftlint lint
          --reporter github-actions-logging
          .

  strict-concurrency:
    name: Strict concurrency
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build with complete strict concurrency checking
        run: ./scripts/check-strict-concurrency.sh

  ios-tests:
    name: iOS tests
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select an available iPhone simulator
        id: ios-destination
        shell: bash
        run: |
          set -euo pipefail

          device_id="$(
            xcrun simctl list devices available --json |
              jq -r '
                [.devices[] | .[] |
                  select(.isAvailable == true and (.name | startswith("iPhone")))]
                | first
                | .udid // empty
              '
          )"

          if [[ -z "$device_id" ]]; then
            xcrun simctl list devices available
            echo "No available iPhone simulator was found." >&2
            exit 1
          fi

          echo "id=$device_id" >> "$GITHUB_OUTPUT"

      - name: Run iOS unit tests
        id: ios-tests
        run: |
          set -o pipefail
          xcodebuild \
            -project CodexBarIOS.xcodeproj \
            -scheme CodexBarIOS \
            -skipPackagePluginValidation \
            -destination "platform=iOS Simulator,id=${{ steps.ios-destination.outputs.id }}" \
            -resultBundlePath "$RUNNER_TEMP/CodexBarIOSTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Preserve iOS test diagnostics
        if: ${{ failure() && steps.ios-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CodexBarIOSTests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/CodexBarIOSTests.xcresult
          if-no-files-found: warn
          retention-days: 14

  watch-tests:
    name: watchOS tests
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Apple Watch simulator selection
        run: ./scripts/tests/select-watch-simulator-tests.sh

      - name: Select a compatible Apple Watch simulator
        id: watch-destination
        shell: bash
        run: |
          set -euo pipefail

          device_id="$(./scripts/select-watch-simulator.sh)"

          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b

          echo "id=$device_id" >> "$GITHUB_OUTPUT"

      - name: Run watchOS unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project CodexBarIOS.xcodeproj \
            -scheme CodexBarWatchTests \
            -skipPackagePluginValidation \
            -destination "platform=watchOS Simulator,id=${{ steps.watch-destination.outputs.id }}" \
            CODE_SIGNING_ALLOWED=NO \
            test

  smoke-tests:
    name: SwiftPM smoke tests
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run smoke harness
        run: xcrun swift run CodexBarIOSSmokeTests
